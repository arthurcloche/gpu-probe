<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>webgpu-analyzer demo</title>
    <style>
      html, body { margin: 0; background: #111; color: #eee; font: 14px ui-sans-serif, system-ui; }
      body { padding: 16px; }
      canvas { display: block; background: #000; border: 1px solid #333; margin-top: 12px; }
      code { background: #222; padding: 2px 4px; border-radius: 3px; }
      h1 { font-size: 16px; margin: 0 0 6px; }
      p  { margin: 4px 0; color: #aaa; }
      #err { color: #f55; font: 12px ui-monospace, Menlo, monospace; white-space: pre; }
    </style>
  </head>
  <body>
    <h1>webgpu-analyzer demo</h1>
    <p>One render pipeline (triangle-list, indexed) + one compute pipeline (storage buffer ping). Open the HUD's <code>GPU</code> tab.</p>
    <canvas id="scene" width="640" height="360"></canvas>
    <div id="err"></div>

    <script src="../dist/gpu-probe.js"></script>
    <script>
      GPUProbe.install();
      GPUProbe.showHUD();
    </script>

    <script type="module">
      const err = document.getElementById("err");
      if (!navigator.gpu) { err.textContent = "WebGPU not available in this browser."; throw new Error("no webgpu"); }

      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) { err.textContent = "No GPU adapter."; throw new Error("no adapter"); }
      const device = await adapter.requestDevice({ label: "demo-device" });

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("webgpu");
      const format = navigator.gpu.getPreferredCanvasFormat();
      ctx.configure({ device, format, alphaMode: "opaque" });

      // ---- render pipeline ----
      const renderModule = device.createShaderModule({
        label: "triangle-shader",
        code: /* wgsl */`
          struct VSOut {
            @builtin(position) pos: vec4f,
            @location(0) col: vec3f,
          };

          struct Uniforms { time: f32 };
          @group(0) @binding(0) var<uniform> U: Uniforms;

          @vertex
          fn vs(@location(0) pos: vec2f, @location(1) col: vec3f) -> VSOut {
            let c = cos(U.time); let s = sin(U.time);
            let r = mat2x2<f32>(c, -s, s, c);
            var out: VSOut;
            out.pos = vec4f(r * pos, 0.0, 1.0);
            out.col = col;
            return out;
          }

          @fragment
          fn fs(in: VSOut) -> @location(0) vec4f {
            return vec4f(in.col, 1.0);
          }
        `,
      });

      const renderPipeline = device.createRenderPipeline({
        label: "triangle-pipeline",
        layout: "auto",
        primitive: { topology: "triangle-list", cullMode: "none" },
        vertex: {
          module: renderModule, entryPoint: "vs",
          buffers: [{
            arrayStride: 5 * 4,
            attributes: [
              { shaderLocation: 0, format: "float32x2", offset: 0 },
              { shaderLocation: 1, format: "float32x3", offset: 8 },
            ],
          }],
        },
        fragment: { module: renderModule, entryPoint: "fs", targets: [{ format }] },
      });

      const vertices = new Float32Array([
        // x, y, r, g, b
         0.0,  0.5, 1, 0, 0,
        -0.5, -0.5, 0, 1, 0,
         0.5, -0.5, 0, 0, 1,
      ]);
      const vbo = device.createBuffer({ label: "triangle-vbo", size: vertices.byteLength,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
      device.queue.writeBuffer(vbo, 0, vertices);

      // WebGPU writeBuffer requires the byte size to be a multiple of 4, so pad with a sentinel.
      const indices = new Uint16Array([0, 1, 2, 0]);
      const ibo = device.createBuffer({
        label: "triangle-ibo",
        size: indices.byteLength,  // 8 bytes
        usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
      });
      device.queue.writeBuffer(ibo, 0, indices);

      // Uniform buffers must be at least 16 bytes per WebGPU spec, even if the
      // struct only contains a single f32. We allocate 16 and only write the first 4.
      const uniformBuf = device.createBuffer({
        label: "uniforms",
        size: 16,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      const bindGroup = device.createBindGroup({
        label: "uniform-bindgroup",
        layout: renderPipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uniformBuf } }],
      });

      // ---- compute pipeline ----
      const computeModule = device.createShaderModule({
        label: "ping-compute",
        code: /* wgsl */`
          @group(0) @binding(0) var<storage, read_write> data: array<f32>;
          @compute @workgroup_size(64)
          fn main(@builtin(global_invocation_id) id: vec3u) {
            let i = id.x;
            if (i >= arrayLength(&data)) { return; }
            data[i] = data[i] + 0.001;
          }
        `,
      });
      const computePipeline = device.createComputePipeline({
        label: "ping-pipeline",
        layout: "auto",
        compute: { module: computeModule, entryPoint: "main" },
      });
      const storageBuf = device.createBuffer({
        label: "ping-storage", size: 64 * 1024,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
      });
      const computeBG = device.createBindGroup({
        label: "compute-bindgroup",
        layout: computePipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: storageBuf } }],
      });

      function frame(t) {
        const time = t * 0.001;
        device.queue.writeBuffer(uniformBuf, 0, new Float32Array([time]));

        const enc = device.createCommandEncoder({ label: "frame-enc" });

        // compute pass
        const cpass = enc.beginComputePass({ label: "ping" });
        cpass.setPipeline(computePipeline);
        cpass.setBindGroup(0, computeBG);
        cpass.dispatchWorkgroups(256);
        cpass.end();

        // render pass
        const view = ctx.getCurrentTexture().createView();
        const rpass = enc.beginRenderPass({
          label: "triangle",
          colorAttachments: [{
            view, loadOp: "clear", storeOp: "store",
            clearValue: { r: 0.05, g: 0.05, b: 0.08, a: 1 },
          }],
        });
        rpass.setPipeline(renderPipeline);
        rpass.setBindGroup(0, bindGroup);
        rpass.setVertexBuffer(0, vbo);
        rpass.setIndexBuffer(ibo, "uint16");
        rpass.drawIndexed(3);
        rpass.end();

        device.queue.submit([enc.finish()]);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
