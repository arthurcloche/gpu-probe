<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>three shader state probe</title></head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<pre id="out" style="font:11px monospace;background:#111;color:#cde;padding:8px;white-space:pre-wrap"></pre>
<script type="importmap">
{ "imports": { "three": "https://esm.sh/three@0.169.0" } }
</script>
<script type="module">
import * as THREE from "three";
const out = (s) => document.getElementById("out").textContent += s + "\n";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas });
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
cam.position.z = 3;
const mat = new THREE.MeshBasicMaterial({ color: 0xff8844 });
const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat);
scene.add(mesh);
renderer.render(scene, cam);

const gl = renderer.getContext();
out("after render():");
out(`  info.programs.length = ${renderer.info.programs.length}`);
for (const pw of renderer.info.programs) {
  const glp = pw.program;
  const attached = gl.getAttachedShaders(glp) || [];
  out(`  program: cacheKey="${(pw.cacheKey||"").slice(0,30)}...", attached=${attached.length}`);
  for (const s of attached) {
    const type = gl.getShaderParameter(s, gl.SHADER_TYPE);
    const typeName = type === gl.VERTEX_SHADER ? "VS" : "FS";
    const src = gl.getShaderSource(s) || "";
    const deleted = gl.getShaderParameter(s, gl.DELETE_STATUS);
    out(`    ${typeName}: source=${src.length} chars, deleted=${deleted}`);
  }
  // Three.js may keep these on the wrapper:
  out(`    pw.vertexShader = ${pw.vertexShader ? "yes" : "no"}, pw.fragmentShader = ${pw.fragmentShader ? "yes" : "no"}`);
}
</script>
</body>
</html>
